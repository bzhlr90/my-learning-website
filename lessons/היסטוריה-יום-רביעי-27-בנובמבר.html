<main><p class="crumbs"><a href="../index.html">ראשי</a> &rsaquo; <a href="../subjects/היסטוריה.html">היסטוריה</a></p><article><h1>יום רביעי 27 בנובמבר</h1><p><strong>תחום המושב</strong></p><p>אזור שיוחד ליהודים תחת האימפריה הרוסית מ1791 עד ל1917</p><p><strong>כתב הסבלנות</strong></p><p>הוא כתב שהעניק ליהודים זכויות כמעט שוות</p><p><strong>מהי אמנציפציה בהקשרה היהודי?</strong></p><p>אמנציפציה היא מושג המתייחס ליהודים והינו כתב זכויות שנתן ליהודי אירופה שוויון זכויות חוקי מלא</p></article></main>
