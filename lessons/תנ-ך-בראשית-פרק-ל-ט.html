<main><p class="crumbs"><a href="../index.html">ראשי</a> &rsaquo; <a href="../subjects/תנ-ך.html">תנ&#x27;&#x27;ך</a></p><article><h1>בראשית פרק ל&#x27;&#x27;ט</h1><p><strong>בראשית פרק ל&quot;ט:</strong></p><p>יוסף מצליח בבית פוטיפר – פוטיפר ממנה את יוסף לאחראי על ביתו.</p><p>&quot;וְלֹא־יָדַ֤ע אִתּוֹ֙ מְא֔וּמָה&quot; – פוטיפר לא מתערב לו.</p><p>&quot;כִּ֥י אִם־הַלֶּ֖חֶם אֲשֶׁר־ה֣וּא אוֹכֵ֑ל&quot; – או שאסור למצרים לאכול לחם מבחינה דתית או שהלחם זאת אשתו של פוטיפר.</p></article></main>
