<main><p class="crumbs"><a href="../index.html">ראשי</a> &rsaquo; <a href="../subjects/לשון.html">לשון</a></p><article><h1>סוגי משפטים</h1><p><strong>סוגי משפטים</strong></p><p>משפט פשוט:</p><p>משפט שיש בו פועל אחד</p><p>משפט מחובר\מאוחה:</p><p>יש בו יותר מפועל אחד</p><p>והוא מורכב משני נשוא וביניהם מילת קישור</p><p>משפט מורכב:</p><p>יש בו יותר מפועל אחד ויש בו מילת שיעבוד</p><p>משפט חיווי – משפט עם נקודה בסופו.</p></article></main>
