<main><p class="crumbs"><a href="../index.html">ראשי</a> &rsaquo; <a href="../subjects/לשון.html">לשון</a></p><article><h1>דרכי תצורת השם</h1><p><strong>דרכי תצורת השם:</strong></p><ul><li>מילה + מילה=הלחם בסיסים.</li><li>שאילה מלעז.</li><li>נוטריקון – ראשי תיבות מוסכמים שהפכו למילה.</li><li>בסיס + צורן סופי=מילה + סיומת.</li><li>שורש + משקל התבנית</li></ul></article></main>
